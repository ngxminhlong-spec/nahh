name: iOS OTA Auto-Deploy

on:
  push:
    paths:
      - 'ipas/*.ipa'
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Hoặc dán link IPA trực tiếp'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          brew install zsign

      - name: Locate and Process IPA
        run: |
          mkdir -p public
          
          # 1. Tìm file IPA trong thư mục ipas/ hoặc lấy từ URL
          if [ -d "ipas" ] && ls ipas/*.ipa 1> /dev/null 2>&1; then
            LOCAL_IPA=$(ls ipas/*.ipa | head -n 1)
            echo "Tìm thấy IPA: $LOCAL_IPA"
            cp "$LOCAL_IPA" public/app.ipa
          elif [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            echo "Đang tải IPA từ URL..."
            curl -L "${{ github.event.inputs.ipa_url }}" -o public/app.ipa
          else
            echo "Lỗi: Không tìm thấy file IPA nào!"
            exit 1
          fi

      - name: Sign IPA (Optional step if using your Apple ID)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "Tiến hành ký ứng dụng..."
          # Nếu bạn muốn dùng zsign hoặc script ký tại đây, ví dụ:
          # zsign -k cert.p12 -p password public/app.ipa
          # Hiện tại giữ nguyên file để dựng OTA test trước
          echo "Đã sẵn sàng file IPA."

      - name: Generate OTA Manifest and Web Portal
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          USER_NAME="${{ github.repository_owner }}"
          BASE_URL="https://$USER_NAME.github.io/$REPO_NAME"

          # Tạo manifest.plist chuẩn chỉnh cho OTA
          cat <<EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>$BASE_URL/app.ipa</string>
                          </dict>
                      </array>
                      <metadata>
                          <key>bundle-identifier</key>
                          <string>com.ota.installer.app</string>
                          <key>bundle-version</key>
                          <string>1.0.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>iOS OTA App</string>
                      </metadata>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # Tạo giao diện trang web đẹp mắt trên GitHub Pages
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Cài đặt ứng dụng qua OTA</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding-top: 80px; background: #000; color: #fff; }
                  .card { background: #1c1c1e; display: inline-block; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 90%; }
                  .btn { background: #0a84ff; color: white; padding: 15px 30px; font-size: 16px; border: none; border-radius: 14px; text-decoration: none; display: block; font-weight: bold; margin-top: 20px; }
                  .btn-secondary { background: #2c2c2e; }
                  .btn:active { opacity: 0.8; }
                  p { color: #8e8e93; font-size: 14px; margin-top: 10px; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>Cài đặt ứng dụng</h2>
                  <p>Mở trang này bằng Safari trên iPhone để cài đặt trực tiếp.</p>
                  
                  <a class="btn" href="itms-services://?action=download-manifest&url=$BASE_URL/manifest.plist">Cài đặt trực tiếp qua OTA</a>
                  
                  <a class="btn btn-secondary" href="$BASE_URL/app.ipa">Tải file .ipa dự phòng</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
