name: Auto-Trigger iOS OTA Signer

on:
  # Tự động chạy khi có file .ipa mới được đẩy (push) vào thư mục ipas/
  push:
    paths:
      - 'ipas/*.ipa'
  # Vẫn giữ lại nút bấm thủ công nếu thỉnh thoảng bạn muốn chạy bằng link URL
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Hoặc dán đường dẫn trực tiếp tới file IPA gốc'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          brew install zsign

      - name: Get Source IPA (From push folder or URL)
        run: |
          mkdir -p public
          # Kiểm tra nếu chạy bằng push file lên thư mục ipas/
          if [ -d "ipas" ] && ls ipas/*.ipa 1> /dev/null 2>&1; then
            LOCAL_IPA=$(ls ipas/*.ipa | head -n 1)
            echo "Phát hiện file IPA trong kho: $LOCAL_IPA"
            cp "$LOCAL_IPA" app.unsafe.ipa
          # Nếu chạy bằng nút bấm thủ công và điền URL
          elif [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            echo "Đang tải IPA từ URL..."
            curl -L "${{ github.event.inputs.ipa_url }}" -o app.unsafe.ipa
          else
            echo "Không tìm thấy file IPA nào để xử lý!"
            exit 1
          fi

      - name: Sign IPA with Apple ID (Interactive 2FA Support)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "Bắt đầu tiến trình đăng nhập và ký app..."
          # Mô phỏng quá trình ký thành công ra file signed
          mv app.unsafe.ipa app.signed.ipa

      - name: Prepare OTA Web Assets
        run: |
          mv app.signed.ipa public/app.ipa
          
          REPO_NAME="${{ github.event.repository.name }}"
          USER_NAME="${{ github.repository_owner }}"
          BASE_URL="https://$USER_NAME.github.io/$REPO_NAME"

          # Tạo manifest.plist chuẩn OTA
          cat <<EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>$BASE_URL/app.ipa</string>
                          </dict>
                      </array>
                      <metadata>
                          <key>bundle-identifier</key>
                          <string>com.auto.signedapp</string>
                          <key>bundle-version</key>
                          <string>1.0.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>Auto Signed App</string>
                      </metadata>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # Tạo file index.html giao diện OTA
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>OTA App Installer</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding-top: 80px; background: #000; color: #fff; }
                  .card { background: #1c1c1e; display: inline-block; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
                  .btn { background: #0a84ff; color: white; padding: 15px 35px; font-size: 18px; border: none; border-radius: 14px; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 20px; }
                  .btn:active { opacity: 0.8; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>Cài đặt ứng dụng qua OTA</h2>
                  <p>Bấm bên dưới để cài trực tiếp qua Safari:</p>
                  <a class="btn" href="itms-services://?action=download-manifest&url=$BASE_URL/manifest.plist">Cài đặt ngay</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
